name: Site

# minitui.org (1.x spec §21.5): deployed for each release tag, so the API reference matches the package, and by
# hand from main for a guide fix between releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Record the demos (1.x spec §21.4)
        run: dotnet run --project tools/SiteMedia --configuration Release -- site/media

      # minitui.org/desk, built from the desk repo's latest release (desk spec §16.7). Its tag can't start this
      # workflow, so a desk release is followed by running this one by hand. Before desk's first release there's no
      # tag, and no /desk.
      - name: Find Desk's latest release
        id: desk
        run: |
          tag=$(git ls-remote --tags --refs "$DESK_REPO" 'v*' | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          echo "Desk: ${tag:-no release}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          DESK_REPO: https://github.com/minitui-org/desk

      - uses: actions/checkout@v4
        if: steps.desk.outputs.tag != ''
        with:
          repository: minitui-org/desk
          ref: ${{ steps.desk.outputs.tag }}
          path: desk

      - name: Put Desk in the menu
        if: steps.desk.outputs.tag != ''
        run: |
          printf -- '- name: Desk\n  href: /desk/\n' >> site/toc.yml

      - name: Build the site
        run: dotnet docfx site/docfx.json --warningsAsErrors

      # Desk's own docfx.json, with this site's template for its styles and to leave spec references out of the API
      - name: Build Desk's docs
        if: steps.desk.outputs.tag != ''
        working-directory: desk
        run: |
          dotnet tool restore
          dotnet docfx docs/site/docfx.json --warningsAsErrors --output "$GITHUB_WORKSPACE/site/_site/desk" --template "default,modern,$GITHUB_WORKSPACE/site/template"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
